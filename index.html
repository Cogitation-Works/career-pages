function screen(j,exp,qual,text){
 const found=j.req.filter(k=>has(text,k)),missing=j.req.filter(k=>!found.includes(k)),pf=j.pref.filter(k=>has(text,k));
 const elig=Math.round(70*found.length/j.req.length+15*(j.pref.length?pf.length/j.pref.length:1)+(exp>=j.exp?15:0));
 const must=[];if(exp<j.exp)must.push(`needs ${j.exp}+ years of experience`);if(QUALS.indexOf(qual)<QUALS.indexOf(j.qual))must.push(`needs ${j.qual} or higher`);
 const stage=must.length?"ineligible":elig>=j.minScore?"invited":"review";
 const why=(must.length?"Mandatory rule not met: "+must.join(", "):`Score ${elig}, ${stage==="invited"?"at or above":"below"} the cut-off of ${j.minScore}`)+`. Required found: ${found.join(", ")||"none"}. Missing: ${missing.join(", ")||"none"}. Preferred found: ${pf.join(", ")||"none"}.`;
 return{elig,found,missing,why,stage};
}

}

duate",2,0,"ineligible"],[1,"Janani",5,"Graduate",4,2,"selected",86],[1,"Abdul",7,"Graduate",3,1,"rejected",71],[1,"Pavithra",4,"Graduate",1,0,"review"],[1,"Hari",3,"Diploma",4,1,"ineligible"],[1,"Ishita",6,"Postgraduate",4,3,"scheduled",100],[1,"Naveen",4,"Graduate",3,1,"failed",29],[1,"Roshni",5,"Graduate",4,1,"invited"],[1,"Sathish",8,"Graduate",4,2,"passed",86],[1,"Varsha",3,"Graduate",2,1,"review"],[1,"Zaid",5,"Graduate",3,2,"failed",43],[1,"Lavanya",6,"Graduate",4,3,"interviewed",100],[1,"Murali",10,"Postgraduate",4,3,"passed",86],[1,"Diya",4,"Graduate",4,2,"invited"]].forEach(([jid,n,exp,qual,rc,pc,stage,test])=>{
  const j=job(jid),text=`${n} (made-up sample resume)\nQualification: ${qual}\nExperience: ${exp} years\nSkills: ${[...j.req.slice(0,rc),...j.pref.slice(0,pc)].join(", ")}`,r=screen(j,exp,qual,text),email=n.toLowerCase()+"@example.com";
  const a={...r,id:"APP-"+S.next++,job:jid,name:"Example: "+n,email,phone:"00000 00000",city:"Example city",qual,exp,notice:"15 days",file:n.toLowerCase()+"-resume.pdf",text,test:test??null,secs:120+n.length*10,history:[]};
  log(a,"Application received");log(a,"Screening: "+STAGE[r.stage]);
  if(["scheduled","interviewed","selected","waitlisted","rejected"].includes(stage))a.interview={when:"2026-12-03T11:00",mode:"Video call"};

let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let rankFocus=null,rankOpen={};
let admin=location.hash==="#admin",view=admin?"dash":"jobs",cur=null,pick=1,edit=null,timer=null,aflt={q:"",job:"",stage:""},me="";
const CT=[["jobs","Job opening"],["inbox","Email inbox (simulated)"]];
const AT=[["dash","Dashboard"],["rank","Ranking"],["interviews","Interviews"],["manage","Jobs"],["bank","Tests"],["outbox","Emails"]];
function go(v){clearInterval(timer);view=v;render()}
function portal(x){admin=x;location.hash=x?"admin":"candidate";go(x?"dash":"jobs")}
function render(){
 $("portal").innerHTML=`<span class="mute">Demo view:</span><button class="${admin?'alt':''}" onclick="portal(false)">Candidate</button><button class="${admin?'':'alt'}" onclick="portal(true)">Super admin</button>`;
 $("nav").innerHTML=(admin?AT:CT).map(([v,n])=>`<button class="${view===v?'':'alt'}" onclick="go('${v}')">${n}</button>`).join("");
 ({jobs,apply,done,track,test,inbox,dash,apps,rank,interviews,manage,bank,outbox})[view]();
}
const page=h=>$("view").innerHTML=h,empty=t=>`<div class="card">${t}</div>`;
const options=(list,sel,all)=>(all?`<option value="">${all}</option>`:"")+list.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(sel)?"selected":""}>${esc(n)}</option>`).join("");
const same=l=>[...new Set(l)].map(x=>[x,x]);
/* candidate */
function jobs(){
 page(`<div class="card"><b>How it works:</b> apply with your resume, pass screening, take the online test, attend an interview. Track every step after you apply.</div>
 ${S.jobs.filter(isOpen).map(j=>`<div class="card"><div class="row"><h3>${esc(j.title)}</h3><button onclick="cur=${j.id};go('apply');scrollTo(0,0)">Apply now</button></div><div class="mute">${esc(j.dept)} · ${esc(j.type)} · ${esc(j.loc)} · ${j.exp}+ years · ${j.qual} or higher · Apply by ${j.deadline}${j.salary?" · "+esc(j.salary):""}</div><p>${esc(j.desc)}</p><div class="mute">Required: ${esc(j.req.join(", "))}<br>Preferred: ${esc(j.pref.join(", "))}</div></div>`).join("")||empty("This position is not accepting applications right now.")}`);
}
async function readResume(f){
 if(f.size>5e6)throw Error("The file is over 5 MB.");
 const ext=f.name.split(".").pop().toLowerCase(),buf=await f.arrayBuffer();
 if(ext==="pdf"){const d=await pdfjsLib.getDocument({data:buf}).promise;let t="";for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("")}return t}
 if(ext==="docx")return(await mammoth.extractRawText({arrayBuffer:buf})).value;
 if(ext==="txt")return new TextDecoder().decode(buf);
 throw Error("Upload a PDF, DOCX or TXT file.");
}
function apply(){
 const j=job(cur),F=(id,l,extra="required")=>`<div><label for="${id}">${l}</label><input id="${id}" ${extra}></div>`;
 page(`<p><button type="button" class="alt" onclick="go('jobs')">Back to job</button></p><form class="card" id="f"><h3>Apply for ${esc(j.title)}</h3><h2>Personal</h2><div class="grid">${F("n","Full name")}${F("e","Email",'type="email" required')}${F("p","Mobile number",'type="tel" required')}${F("c","Current location")}</div>
 <h2>Education</h2><div class="grid"><div><label for="ql">Highest qualification</label><select id="ql">${options(same(QUALS),"Graduate")}</select></div>${F("sp","Specialization","")}${F("col","College or university","")}${F("gy","Graduation year",'type="number" min="1970" max="2032"')}</div>
 <h2>Work</h2><div class="grid">${F("x","Total experience in years (0 for fresher)",'type="number" min="0" step="0.5" required')}${F("pc","Previous company","")}${F("des","Current designation","")}${F("sk","Skills","")}${F("lang","Languages known","")}${F("sal","Expected salary","")}${F("nt","Notice period","")}</div>
 <h2>Resume</h2><label for="r">Resume (PDF, DOCX or TXT, up to 5 MB)</label><input id="r" type="file" accept=".pdf,.docx,.txt" required>
 <label for="cv">Cover letter</label><textarea id="cv" rows="3"></textarea>
 <label class="opt"><input type="checkbox" id="ok" required>I agree that my details can be used for this recruitment.</label>
 <p class="bad" id="err" role="alert"></p><button>Submit application</button></form>`);
 $("f").onsubmit=async ev=>{ev.preventDefault();const v=id=>$(id).value.trim(),btn=ev.target.querySelector("button"),err=$("err"),email=v("e").toLowerCase(),file=$("r").files[0];
  const dup=S.apps.find(a=>a.job===j.id&&a.email.toLowerCase()===email);
  if(dup){err.textContent="This email has already applied for this job. Application ID: "+dup.id;return}
  const d={name:v("n"),email,phone:v("p"),city:v("c"),qual:v("ql"),spec:v("sp"),college:v("col"),year:v("gy"),exp:+v("x"),company:v("pc"),role:v("des"),skills:v("sk"),langs:v("lang"),salary:v("sal"),notice:v("nt"),cover:v("cv")};
  btn.disabled=true;err.textContent="";let text;
  try{text=await readResume(file);if(!text.trim())throw Error("No text found. Scanned image resumes cannot be read.")}catch(e){err.textContent="Could not read the resume. "+e.message;btn.disabled=false;return}
  const r=screen(j,d.exp,d.qual,text+" "+d.skills),a={...d,...r,id:"APP-"+S.next++,job:j.id,file:file.name,text:text.slice(0,4000),test:null,history:[]};
  S.apps.push(a);log(a,"Application received");setStage(a,r.stage,"automatic screening");save();me=a.id;if(view==="apply")go("done")};
}
function done(){page(`<div class="card"><h3>Application received</h3><p>Your application ID is <b>${me}</b>. Keep it to track your status.</p><button onclick="go('track')">Track my application</button></div>`)}
function track(){
 const a=app(me);
 page(`<form class="card" id="tf"><div class="grid"><div><label for="tid">Application ID</label><input id="tid" required value="${esc(me)}" placeholder="APP-1006"></div><div><label for="tem">Email used to apply</label><input id="tem" type="email" required value="${esc(a?a.email:"")}"></div></div><p class="bad" id="te" role="alert"></p><button>View status</button><p class="mute">Try the example APP-1006 with imran@example.com.</p></form><div id="st"></div>`);
 $("tf").onsubmit=e=>{e.preventDefault();const x=app($("tid").value.trim().toUpperCase());
  if(!x||x.email.toLowerCase()!==$("tem").value.trim().toLowerCase()){$("te").textContent="No application matches that ID and email.";$("st").innerHTML="";return}me=x.id;render()};
 if(!a)return;
 const steps=["Application received","Screening","Online test","Interview","Decision"];
 const at={review:1,ineligible:4,invited:2,failed:2,passed:3,scheduled:3,interviewed:3,selected:4,waitlisted:4,rejected:4}[a.stage];
 $("st").innerHTML=`<div class="card"><h3>${esc(job(a.job).title)}: ${SEEN[a.stage]}</h3><div class="mute">${a.id} · ${esc(a.name)}</div><ol class="track">${steps.map((s,i)=>`<li class="${i<at?'done':i===at?'now':''}">${s}</li>`).join("")}</ol>
 ${a.stage==="invited"?`<p>Your test has ${S.tests[a.job].length} questions and a ${job(a.job).mins} minute limit. You can submit once.</p><button onclick="startTest('${a.id}')">Start test</button>`:""}
 ${a.stage==="scheduled"&&a.interview?`<p><b>Interview:</b> ${esc(a.interview.when.replace("T"," at "))}, ${esc(a.interview.mode)}</p>`:""}</div>
 <h2>Updates</h2>${S.mail.filter(m=>m.app===a.id).map(mailCard).join("")}`;
}
function startTest(id){cur=id;go("test")}
function test(){
 const a=app(cur);if(!a||a.stage!=="invited"){go("track");return}
 const j=job(a.job),qs=[...S.tests[j.id]].sort(()=>Math.random()-.5),start=Date.now();
 page(`<form id="t"><div class="card row"><b>${esc(j.title)} test · pass mark ${j.pass}%</b><span id="clock"></span></div>${qs.map((q,i)=>`<div class="card">${q.sc?`<p><b>Scenario:</b> ${esc(q.sc)}</p>`:""}<b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,k)=>`<label class="opt"><input type="radio" id="q${i}_${k}" name="q${i}" value="${k}" required>${esc(o)}</label>`).join("")}</div>`).join("")}<button>Submit test</button></form>`);
 const finish=()=>{clearInterval(timer);const d=new FormData($("t"));
  a.test=Math.round(qs.filter((q,i)=>d.get("q"+i)===String(q.a)).length/qs.length*100);a.secs=Math.round((Date.now()-start)/1000);
  setStage(a,a.test>=j.pass?"passed":"failed","test submitted");save();me=a.id;go("track")};
 const tick=()=>{const left=j.mins*60-Math.floor((Date.now()-start)/1000);if(left<=0)return finish();$("clock").textContent=`Time left ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`};
 tick();timer=setInterval(tick,1000);$("t").onsubmit=e=>{e.preventDefault();finish()};
}
function mailCard(m){return`<div class="card"><h3>${esc(m.subject)}</h3><div class="mute">To ${esc(m.to)} · ${esc(m.at)}</div><p>${esc(m.body)}</p></div>`}
function inbox(){const l=S.mail.filter(m=>m.app===me);page(`<p class="mute">Stands in for your real email. It shows mail for the application you applied with or tracked.</p>`+(l.map(mailCard).join("")||empty("Apply or track an application to see its emails.")))}
/* HR admin */
function report(){return S.jobs.map(j=>{const l=S.apps.filter(a=>a.job===j.id),el=l.filter(a=>!["review","ineligible"].includes(a.stage)),t=l.filter(a=>a.test!=null);
 return[j.title,l.length,l.length?Math.round(el.length/l.length*100)+"%":"-",el.length?Math.round(t.length/el.length*100)+"%":"-",t.length?Math.round(t.reduce((s,a)=>s+a.test,0)/t.length):"-",l.filter(a=>a.stage==="selected").length]})}
const HEAD=["Job","Applications","Passed screening","Test completion","Average test","Selected"];
function group(title,l,none,link){return`<h2>${title} (${l.length})</h2><div class="card">${l.length?`<div class="scroll"><table><tr><th>Candidate</th><th>Status</th><th>Screening</th><th>Test</th><th>Email</th><th>ID</th></tr>${l.map(a=>`<tr><td>${link?`<button class="lnk" onclick="openRank('${a.id}')" title="Open in Ranking">${esc(a.name)}</button>`:esc(a.name)}</td><td>${STAGE[a.stage]}</td><td>${a.elig}</td><td>${a.test==null?"-":a.test+"%"}</td><td>${esc(a.email)}</td><td>${a.id}</td></tr>`).join("")}</table></div>`:`<span class="mute">${none}</span>`}</div>`}
function dash(){
 const sel=S.apps.filter(a=>a.stage==="selected");
 const n=(...s)=>S.apps.filter(a=>s.includes(a.stage)).length,max=Math.max(1,...Object.keys(STAGE).map(s=>n(s)));
 page(`<div class="stats">${[["Selected",n("selected")],["Tests pending",n("invited")],["Overall candidates",S.apps.length],["Need review",n("review")],["Tests completed",S.apps.filter(a=>a.test!=null).length]].map(([l,v])=>`<div class="card"><b>${v}</b><div class="mute">${l}</div></div>`).join("")}</div>
 ${group("Selected candidates",S.apps.filter(a=>a.stage==="selected"),"No one has been selected yet.",true)}${group("Tests pending",S.apps.filter(a=>a.stage==="invited"),"No tests are pending.")}${group("Overall candidates",S.apps,"No applications yet.")}
 <h2>Candidates by current stage</h2><div class="card">${Object.keys(STAGE).map(s=>`<div class="pipe"><span>${STAGE[s]}</span><span><i style="width:${n(s)/max*100}%"></i></span><span>${n(s)}</span></div>`).join("")}</div>
 <h2>Job report</h2><div class="card"><div class="scroll"><table><tr>${HEAD.map(h=>`<th>${h}</th>`).join("")}</tr>${report().map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div><p><button class="alt" id="cp">Copy report for Excel</button></p><textarea id="out" rows="5" hidden readonly></textarea></div>`+`<button class="alt" onclick="seed();save();me='';render()">Reset demo data</button>`);
 $("cp").onclick=async()=>{const t=[HEAD,...report()].map(r=>r.join("\t")).join("\n");try{await navigator.clipboard.writeText(t);$("cp").textContent="Copied"}catch(e){$("out").hidden=false;$("out").value=t;$("out").select()}};
}
function apps(){
 page(`<div class="grid"><div><label for="aq">Search name, email or ID</label><input id="aq" value="${esc(aflt.q)}"></div><div><label for="aj">Job</label><select id="aj">${options(S.jobs.map(j=>[j.id,j.title]),aflt.job,"All jobs")}</select></div><div><label for="as">Stage</label><select id="as">${options(Object.entries(STAGE),aflt.stage,"All stages")}</select></div></div><div id="list" style="margin-top:12px"></div>`);
 const draw=()=>{aflt={q:$("aq").value,job:$("aj").value,stage:$("as").value};
  $("list").innerHTML=S.apps.slice().reverse().filter(a=>(!aflt.job||a.job==aflt.job)&&(!aflt.stage||a.stage===aflt.stage)&&`${a.name} ${a.email} ${a.id}`.toLowerCase().includes(aflt.q.toLowerCase())).map(a=>`<div class="card"><div class="row"><h3>${esc(a.name)}</h3><span class="${["ineligible","failed","rejected"].includes(a.stage)?'bad':'good'}">${STAGE[a.stage]}</span></div>
  <div class="mute">${a.id} · ${esc(job(a.job).title)} · Screening ${a.elig}${a.test==null?"":" · Test "+a.test+"%"}</div><div class="mute">${esc(a.why)}</div>
  <details><summary>Profile, resume and history</summary><p>${[["Email",a.email],["Mobile",a.phone],["Location",a.city],["Qualification",[a.qual,a.spec,a.college,a.year].filter(Boolean).join(", ")],["Experience",a.exp+" years"],["Previous",[a.company,a.role].filter(Boolean).join(", ")],["Skills",a.skills],["Languages",a.langs],["Expected salary",a.salary],["Notice",a.notice],["Cover letter",a.cover]].filter(x=>x[1]).map(([k,v])=>`<b>${k}:</b> ${esc(v)}`).join("<br>")}</p><pre>${esc(a.text)}</pre><div class="mute">${a.history.map(h=>esc(h.at+": "+h.t)).join("<br>")}</div></details>
  <label for="mv${a.id}">Move to stage</label><select id="mv${a.id}" onchange="move('${a.id}',this.value)">${options(Object.entries(STAGE),a.stage)}</select></div>`).join("")||empty("No applications match.")};
 $("aq").oninput=$("aj").onchange=$("as").onchange=draw;draw();
}
function move(id,s){const a=app(id);if(s==="invited")a.test=null;setStage(a,s,"changed by HR");save();render()}
function prof(a){return[["Email",a.email],["Mobile",a.phone],["Location",a.city],["Qualification",[a.qual,a.spec,a.college,a.year].filter(Boolean).join(", ")],["Experience",a.exp+" years"],["Previous",[a.company,a.role].filter(Boolean).join(", ")],["Skills",a.skills],["Languages",a.langs],["Expected salary",a.salary],["Notice",a.notice],["Cover letter",a.cover]].filter(x=>x[1]).map(([k,v])=>`<b>${k}:</b> ${esc(v)}`).join("<br>")}
function openRank(id){rankFocus=id;go("rank")}
function toggleRank(id){rankOpen[id]=!rankOpen[id];rankFocus=id;render()}
function rank(){
 page(S.jobs.map(j=>{const l=S.apps.filter(a=>a.job===j.id&&a.test!=null&&a.test>=j.pass&&!["rejected","failed"].includes(a.stage)).sort((a,b)=>final(b)-final(a)||a.secs-b.secs);
 const mailto=a=>"mailto:"+encodeURIComponent(a.email).replace(/%40/g,"@")+"?subject="+encodeURIComponent(j.title+" - "+a.name);
 return`<h2>${esc(j.title)}</h2><div class="mute">Final = screening ${100-j.testW}% + test ${j.testW}%</div><div class="card">${l.length?`<div class="scroll"><table><tr><th>Rank</th><th>Candidate</th><th>Screening</th><th>Test</th><th>Final</th><th>Missing skills</th><th>Status</th><th>Actions</th></tr>${l.map((a,i)=>`<tr id="rk-${a.id}" class="${rankFocus===a.id?'hl':''}"><td>${i+1}</td><td>${esc(a.name)}</td><td>${a.elig}</td><td>${a.test}%</td><td><b>${final(a)}</b></td><td>${esc(a.missing.join(", ")||"none")}</td><td>${a.stage==="passed"?`<button onclick="go('interviews')">Schedule interview</button>`:STAGE[a.stage]}</td><td><div class="bar" style="margin:0;flex-wrap:nowrap"><button class="alt" onclick="toggleRank('${a.id}')">${rankOpen[a.id]?"Hide details":"View details"}</button><a class="btn" href="${esc(mailto(a))}">Contact</a></div></td></tr>${rankOpen[a.id]?`<tr class="${rankFocus===a.id?'hl':''}"><td class="det" colspan="8"><p>${prof(a)}</p><pre>${esc(a.text)}</pre><div class="mute">${a.history.map(h=>esc(h.at+": "+h.t)).join("<br>")}</div></td></tr>`:""}`).join("")}</table></div>`:'<span class="mute">No one has passed yet.</span>'}</div>`}).join(""));
 if(rankFocus){const r=$("rk-"+rankFocus);if(r)r.scrollIntoView({block:"center"});rankFocus=null}
}
function interviews(){
 const g=s=>S.apps.filter(a=>a.stage===s),head=a=>`<h3>${esc(a.name)}</h3><div class="mute">${esc(job(a.job).title)} · ${esc(a.email)}</div>`;
 page(`<h2>To schedule</h2>${g("passed").sort((a,b)=>final(b)-final(a)).map(a=>`<form class="card" onsubmit="schedule(event,'${a.id}')">${head(a)}<div class="grid"><div><label for="w${a.id}">Date and time</label><input id="w${a.id}" name="when" type="datetime-local" required></div><div><label for="m${a.id}">Mode</label><select id="m${a.id}" name="mode"><option>Video call</option><option>In person</option><option>Phone</option></select></div></div><p><button>Schedule interview</button></p></form>`).join("")||empty("Candidates who pass the test appear here, ranked by final score, ready to contact and schedule.")}
 <h2>Scheduled</h2>${g("scheduled").map(a=>`<div class="card">${head(a)}<p>${esc(a.interview?.when.replace("T"," at ")||"Time not set")} · ${esc(a.interview?.mode||"")}</p><button onclick="move('${a.id}','interviewed')">Mark completed</button></div>`).join("")||empty("No interviews scheduled.")}
 <h2>Awaiting decision</h2>${g("interviewed").map(a=>`<div class="card">${head(a)}<label for="fb${a.id}">Interviewer feedback</label><textarea id="fb${a.id}" onchange="app('${a.id}').feedback=this.value;save()">${esc(a.feedback)}</textarea><div class="bar"><button onclick="move('${a.id}','selected')">Select</button><button class="alt" onclick="move('${a.id}','waitlisted')">Waitlist</button><button class="alt" onclick="move('${a.id}','rejected')">Reject</button></div></div>`).join("")||empty("No completed interviews are waiting.")}`);
}
function schedule(e,id){e.preventDefault();const a=app(id),d=new FormData(e.target);a.interview={when:d.get("when"),mode:d.get("mode")};setStage(a,"scheduled");save();render()}
function manage(){
 const j=job(edit)||{title:"",dept:"",type:"Full time",loc:"",exp:0,qual:"Graduate",req:[],pref:[],salary:"",desc:"",deadline:"2027-01-31",minScore:65,pass:60,testW:70,mins:10,set:"gen"};
 const F=(k,l,extra="required")=>`<div><label for="j_${k}">${l}</label><input id="j_${k}" value="${esc(Array.isArray(j[k])?j[k].join(", "):j[k])}" ${extra}></div>`,num=(k,l,min,max)=>F(k,l,`type="number" min="${min}" max="${max}" required`);
 page(S.jobs.map(x=>`<div class="card row"><div><h3>${esc(x.title)}</h3><div class="mute">${isOpen(x)?"Open":"Closed"} · apply by ${x.deadline} · ${S.apps.filter(a=>a.job===x.id).length} applications</div></div><div class="bar"><button class="alt" onclick="edit=${x.id};render();$('jf').scrollIntoView()">Edit</button><button class="alt" onclick="job(${x.id}).open=!job(${x.id}).open;save();render()">${x.open?"Close":"Publish"}</button></div></div>`).join("")+
 `<form class="card" id="jf"><h3>${edit?"Edit job":"Create a job"}</h3><div class="grid">${F("title","Job title")}${F("dept","Department")}${F("type","Job type")}${F("loc","Location")}${F("salary","Salary range (optional)","")}${F("deadline","Application deadline",'type="date" required')}</div><label for="j_desc">Description and responsibilities</label><textarea id="j_desc" required>${esc(j.desc)}</textarea>
 <h2>Eligibility rules</h2><div class="grid">${num("exp","Minimum experience (years)",0,40)}<div><label for="j_qual">Minimum qualification</label><select id="j_qual">${options(same(QUALS),j.qual)}</select></div>${F("req","Required skills, comma separated")}${F("pref","Preferred skills, comma separated","")}${num("minScore","Auto-invite score",1,100)}</div>
 <h2>Test and ranking</h2><div class="grid">${num("pass","Pass mark %",1,100)}${num("testW","Test weight in final score %",0,100)}${num("mins","Test time in minutes",1,180)}${edit?"":`<div><label for="j_set">Starting questions</label><select id="j_set">${options([["gen","General"],["pm","Project management"]],"gen")}</select></div>`}</div>
 <p class="bad" id="je" role="alert"></p><div class="bar"><button>${edit?"Save changes":"Publish job"}</button>${edit?'<button type="button" class="alt" onclick="edit=null;render()">Cancel</button>':""}</div></form>`);
 $("jf").onsubmit=e=>{e.preventDefault();const v=k=>$("j_"+k).value.trim(),list=k=>[...new Set(v(k).toLowerCase().split(",").map(s=>s.trim()).filter(Boolean))];
  const d={};["title","dept","type","loc","salary","deadline","desc","qual"].forEach(k=>d[k]=v(k));["exp","minScore","pass","testW","mins"].forEach(k=>d[k]=+v(k));d.req=list("req");d.pref=list("pref");
  if(!d.req.length){$("je").textContent="Add at least one required skill.";return}
  if(edit)Object.assign(job(edit),d);else{const id=Date.now();S.tests[id]=bankFor(v("set"));S.jobs.push({...d,id,set:v("set"),open:true})}edit=null;save();render()};
}
function bank(){
 const j=job(pick)||S.jobs[0];pick=j.id;const qs=S.tests[j.id];
 page(`<label for="pk">Test for job</label><select id="pk">${options(S.jobs.map(x=>[x.id,x.title]),pick)}</select><p class="mute">${qs.length} questions, shown in random order · ${j.mins} minutes · pass mark ${j.pass}%</p>
 ${qs.map((q,i)=>`<div class="card">${q.sc?`<div class="mute"><b>Scenario:</b> ${esc(q.sc)}</div>`:""}<b>${i+1}. ${esc(q.q)}</b><ul>${q.o.map((o,k)=>`<li class="${k===q.a?'good':''}">${esc(o)}${k===q.a?" (correct)":""}</li>`).join("")}</ul>${qs.length>1?`<button class="alt" onclick="S.tests[pick].splice(${i},1);save();render()">Delete question</button>`:""}</div>`).join("")}
 <form class="card" id="qf"><h3>Add a question</h3><label for="sc">Scenario (optional)</label><textarea id="sc"></textarea><label for="qq">Question</label><input id="qq" required>${[0,1,2,3].map(k=>`<label for="o${k}">Option ${k+1}</label><input id="o${k}" required>`).join("")}<label for="ans">Correct option</label><select id="ans">${options([0,1,2,3].map(k=>[k,"Option "+(k+1)]),0)}</select><p><button>Add question</button></p></form>`);
 $("pk").onchange=e=>{pick=+e.target.value;render()};
 $("qf").onsubmit=e=>{e.preventDefault();qs.push({sc:$("sc").value.trim(),q:$("qq").value.trim(),o:[0,1,2,3].map(k=>$("o"+k).value.trim()),a:+$("ans").value});save();render()};
}
function outbox(){page(S.mail.map(mailCard).join("")||empty("No emails yet."))}
onhashchange=()=>{if(admin!==(location.hash==="#admin"))portal(!admin)};
render();
</script>

</body></html>
